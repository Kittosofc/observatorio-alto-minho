<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Observatório territorial da CIM Alto Minho com indicadores municipais do INE e da Pordata.">
  <title>Retrato territorial | Observatório Alto Minho</title>
  <link rel="icon" type="image/svg+xml" href="./FrontEnd/imgs/favicon.svg">
  <!-- Estilos globais -->
  <link rel="stylesheet" href="./FrontEnd/css/shared/global.css">
  <!-- Estilos da página -->
  <link rel="stylesheet" href="./FrontEnd/css/pages/index.css">
</head>
<body data-page="retrato">
  <!-- Cabeçalho e navegação -->
  <header class="rail">
    <a class="brand" href="./index.html" aria-label="Observatório Alto Minho — início">
      <span class="brand-symbol" aria-hidden="true"><img src="./FrontEnd/imgs/cim-alto-minho.svg" alt=""></span>
      <span><b>Alto Minho</b><small>Observatório territorial</small></span>
    </a>
    <div class="rail-territory" style="visibility:hidden" aria-hidden="true">
      <label for="territory-select">Território em análise</label>
      <select id="territory-select" aria-label="Escolha o território"></select>
      <p>10 municípios · NUTS III Alto Minho</p>
    </div>
    <nav aria-label="Navegação principal">
      <a class="active" aria-current="page" href="./index.html"><span>01</span>Retrato</a>
      <a href="./FrontEnd/html/indicadores.html"><span>02</span>Indicadores</a>
      <a href="./FrontEnd/html/comparar.html"><span>03</span>Comparar</a>
      <a href="./FrontEnd/html/metodologia.html"><span>04</span>Metodologia</a>
      <a href="./FrontEnd/html/forms.html"><span>05</span>Metas</a>
      <a href="./FrontEnd/html/transferencias.html"><span>06</span>Documentos</a>
    </nav>
    <div class="rail-note">
      <span class="source-dot"></span>
      <p>Dados estatísticos<br><strong>INE · Pordata</strong></p>
    </div>
  </header>

  <!-- Conteúdo principal -->
  <main id="top">
    <section class="workspace" id="retrato">
      <div class="page-intro">
        <div>
          <p class="overline">01 · Retrato</p>
          <h1>Retrato do Alto Minho</h1>
        </div>
      </div>

      <!-- Alto Minho em números (preenchido por index.js) -->
      <section class="kpi-strip" id="kpi-strip" aria-label="Alto Minho em números" hidden></section>

      <div class="territory-stage">
        <section class="map-panel" aria-label="Mapa dos municípios do Alto Minho">
          <div class="map-caption">
            <span>Mapa municipal</span>
          </div>
          <div class="mini-map" id="mini-map" role="img" aria-label="Alto Minho">
            <svg viewBox="0 0 100 100"><g id="mini-map-shapes"></g></svg>
          </div>
          <svg class="region-map" viewBox="0 0 520 390" role="img" aria-labelledby="map-title map-description">
            <title id="map-title">Mapa interativo dos dez municípios do Alto Minho</title>
            <desc id="map-description">Limites administrativos dos municípios da Comunidade Intermunicipal do Alto Minho.</desc>
            <g id="map-nodes"></g>
          </svg>
          <div class="map-key"><div><small class="map-limits" style="margin-left:0">Limites: CAOP · DGT</small></div><small class="map-sources">Fontes: INE e PORDATA</small></div>
        </section>
      </div>

    </section>
  </main>
  <!-- Dados gerados -->
  <script src="./FrontEnd/js/data/catalog-data.js"></script>
  <script src="./FrontEnd/js/data/indicator-values.js"></script>
  <script src="./FrontEnd/js/data/map-data.js"></script>
  <!-- Núcleo partilhado -->
  <script src="./FrontEnd/js/shared/app.js"></script>
  <!-- Lógica da página -->
  <script src="./FrontEnd/js/pages/municipio.js"></script>
  <script src="./FrontEnd/js/pages/index.js"></script>
</body>
</html>
