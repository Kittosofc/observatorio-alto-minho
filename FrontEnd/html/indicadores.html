<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Observatório territorial da CIM Alto Minho com indicadores municipais do INE e da Pordata.">
  <title>Indicadores | Observatório Alto Minho</title>
  <link rel="icon" type="image/svg+xml" href="../imgs/favicon.svg">
  <!-- Estilos globais -->
  <link rel="stylesheet" href="../css/shared/global.css">
  <!-- Estilos da página -->
  <link rel="stylesheet" href="../css/pages/indicadores.css">
</head>
<body data-page="indicadores">
  <!-- Barra lateral (gerada por rail.js) -->
  <script src="../js/shared/rail.js"></script>

  <!-- Conteúdo principal -->
  <main id="top">
      <section class="workspace page-workspace">
      <div class="page-intro">
        <div>
          <p class="overline">02 · Indicadores</p>
          <h1>Indicadores do território</h1>
        </div>
      </div>

      <section class="catalog-section" id="indicadores">
        <div class="catalog-layout">
          <!-- Coluna 02: pesquisa, indicador selecionado e tabela -->
          <div class="catalog-col">
            <div class="catalog-head">
              <div>
                <h2>Encontrar um indicador</h2>
              </div>
              <label class="search-control">
                <span class="sr-only">Pesquisar indicadores</span>
                <input id="indicator-search" type="search" placeholder="Pesquisar Indicador...">
              </label>
            </div>

            <!-- Botões de categoria (preenchidos por app.js) -->
            <div class="cat-filter" id="category-filter" role="group" aria-label="Filtrar por categoria"></div>
            <div class="cat-filter cat-sub" id="subcategory-filter" role="group" aria-label="Filtrar por subcategoria da Demografia" hidden></div>

            <div class="indicator-detail" id="indicator-detail" aria-live="polite">
              <div class="detail-copy">
                <p class="overline">Indicador selecionado</p>
                <h3 id="detail-name"></h3>
                <p id="detail-description"></p>
              </div>
              <div class="detail-value">
                <span id="detail-territory"></span>
                <strong id="detail-value"></strong>
              </div>
              <dl class="detail-meta">
                <div><dt>Área</dt><dd id="detail-area"></dd></div>
                <div><dt>Ano</dt><dd id="detail-year"></dd></div>
                <div><dt>Leitura</dt><dd id="detail-dimension"></dd></div>
                <div><dt>Fonte</dt><dd><a id="detail-source-link" href="#" target="_blank" rel="noopener"><span id="detail-source"></span> ↗</a></dd></div>
              </dl>
              <div class="detail-breakdown" id="detail-breakdown" hidden></div>
              <button class="detail-action" id="indicator-compare-button" type="button">Comparar municípios <span>↓</span></button>
            </div>

            <p class="overline" id="catalog-caption"></p>
            <div class="catalog-table-wrap">
              <table>
                <thead><tr><th>Indicador</th><th>Área</th><th>Ano</th><th>Fonte</th></tr></thead>
                <tbody id="catalog-body"></tbody>
              </table>
              <p class="empty-state" id="catalog-empty" hidden>Nenhum indicador corresponde à pesquisa.</p>
            </div>
          </div>

        </div>
      </section>
    </section>
  </main>
  <script src="../js/shared/boot.js" data-values="1"></script>
</body>
</html>
