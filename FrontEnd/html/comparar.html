<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Observatório territorial da CIM Alto Minho com indicadores municipais do INE e da Pordata.">
  <title>Comparação municipal | Observatório Alto Minho</title>
  <link rel="icon" type="image/svg+xml" href="../imgs/favicon.svg">
  <!-- Estilos globais -->
  <link rel="stylesheet" href="../css/shared/global.css">
  <!-- Estilos da página -->
  <link rel="stylesheet" href="../css/pages/comparar.css">
</head>
<body data-page="comparar">
  <!-- Barra lateral (gerada por rail.js) -->
  <script src="../js/shared/rail.js"></script>

  <!-- Conteúdo principal -->
  <main id="top">
    <section class="workspace page-workspace cmp">
      <div class="page-intro">
        <div>
          <p class="overline">03 · Comparar</p>
          <h1>Comparação municipal</h1>
          <p>Permite comparar indicadores entre municípios do Alto Minho.</p>
        </div>
      </div>

      <!-- Resumo: indicador e município em destaque (preenchido por comparar.js) -->
      <section class="cmp-summary" id="cmp-summary" aria-live="polite"></section>

      <!-- Cartões de resumo -->
      <section class="cmp-kpis" id="cmp-kpis" aria-live="polite"></section>

      <div class="cmp-row cmp-row-top">
        <!-- Filtros -->
        <aside class="cmp-card cmp-filters" aria-labelledby="cmp-filters-title">
          <h2 id="cmp-filters-title">Filtros</h2>
          <label class="cmp-field">Indicador
            <select id="compare-indicator" aria-label="Indicador a comparar"></select>
          </label>
          <label class="cmp-field">Indicador 2 (comparar)
            <select id="cmp-ind2" aria-label="Segundo indicador a comparar"></select>
          </label>
          <label class="cmp-field">Ano
            <select id="cmp-year" aria-label="Ano"></select>
          </label>
          <label class="cmp-field">Ordenar
            <select id="cmp-order" aria-label="Ordenar municípios">
              <option value="desc">Valor (maior → menor)</option>
              <option value="asc">Valor (menor → maior)</option>
              <option value="az">Nome (A → Z)</option>
            </select>
          </label>
          <fieldset class="cmp-ref">
            <legend>Comparar com</legend>
            <label><input type="radio" name="cmp-ref" value="alto-minho" checked><span>Alto Minho</span><i class="cmp-info" title="Média do conjunto dos 10 municípios do Alto Minho.">i</i></label>
            <label class="is-disabled"><input type="radio" name="cmp-ref" value="norte" disabled><span>Norte</span><i class="cmp-info" title="Dados da região Norte ainda não disponíveis.">i</i></label>
            <label class="is-disabled"><input type="radio" name="cmp-ref" value="portugal" disabled><span>Portugal</span><i class="cmp-info" title="Dados de Portugal ainda não disponíveis.">i</i></label>
          </fieldset>
        </aside>

        <!-- Gráfico de barras -->
        <section class="cmp-card cmp-bars-card" aria-labelledby="cmp-bars-title">
          <h2 id="cmp-bars-title"></h2>
          <div id="cmp-bars" class="cmp-bars"></div>
        </section>
      </div>

      <div class="cmp-row cmp-row-bottom">
        <!-- Evolução -->
        <section class="cmp-card cmp-line-card" aria-labelledby="cmp-line-title">
          <h2 id="cmp-line-title"></h2>
          <div id="cmp-line" class="cmp-line"></div>
        </section>

        <!-- Leitura rápida -->
        <aside class="cmp-card cmp-reading" aria-labelledby="cmp-reading-title">
          <h2 id="cmp-reading-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>Leitura rápida</h2>
          <ul id="cmp-reading"></ul>
        </aside>
      </div>
    </section>
  </main>
  <script src="../js/shared/boot.js" data-page="comparar" data-values="1"></script>
</body>
</html>
