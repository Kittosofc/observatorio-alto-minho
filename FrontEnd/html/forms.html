<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metas | Observatório Alto Minho</title>
  <link rel="icon" type="image/svg+xml" href="../imgs/favicon.svg">
  <!-- Estilos globais -->
  <link rel="stylesheet" href="../css/shared/global.css">
  <!-- Estilos da página -->
  <link rel="stylesheet" href="../css/pages/forms.css">
</head>
<body data-page="forms">
  <!-- Barra lateral (gerada por rail.js) -->
  <script src="../js/shared/rail.js"></script>

  <!-- Conteúdo principal -->
  <main id="top">
    <section class="workspace page-workspace">
      <div class="page-intro">
        <div>
          <p class="overline">05 · Metas</p>
          <h1>Metas dos municípios</h1>
          <p>Carregue o Excel ou CSV exportado do Google Forms e veja as metas cumpridas por cada município.</p>
        </div>
      </div>

      <div class="doc-toolbar">
        <button id="open-upload" class="doc-create" type="button">+ Carregar Excel</button>
        <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden>
      </div>

      <div id="msg"></div>
      <button id="clear" type="button">Limpar</button>
      <div id="content"></div>
    </section>
  </main>

  <!-- Bibliotecas externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="../js/shared/boot.js" data-page="forms"></script>
</body>
</html>
