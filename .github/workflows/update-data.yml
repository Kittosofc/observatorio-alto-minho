name: Atualizar dados estatísticos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "scripts/update-data.py"
      - "scripts/download-pordata.mjs"
      - "data/pordata-sources.json"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: update-statistical-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter o site
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python -m pip install -r requirements.txt

      - name: Confirmar ligação ao INE
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Tentativa INE ${attempt} de 3"
            if python scripts/update-data.py --check-ine; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              wait_seconds=$((attempt * 20))
              echo "O INE não respondeu corretamente. Nova tentativa dentro de ${wait_seconds} segundos."
              sleep "${wait_seconds}"
            fi
          done
          echo "Não foi possível validar a ligação ao INE após três tentativas."
          exit 1

      - name: Descarregar dados da Pordata
        run: npm run download:pordata

      - name: Atualizar e validar os indicadores
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Tentativa ${attempt} de 3"
            if python scripts/update-data.py; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              wait_seconds=$((attempt * 20))
              echo "A fonte ou a rede falhou. Nova tentativa dentro de ${wait_seconds} segundos."
              sleep "${wait_seconds}"
            fi
          done
          echo "A atualização falhou após três tentativas."
          exit 1

      - name: Guardar diagnóstico da validação
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-atualizacao
          path: data/update-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar alterações
        run: |
          if git diff --quiet -- FrontEnd/js/data/indicator-values.js FrontEnd/js/data/catalog-data.js powerbi-data.csv powerbi-historico.csv; then
            echo "Não existem dados novos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FrontEnd/js/data/indicator-values.js FrontEnd/js/data/catalog-data.js powerbi-data.csv powerbi-historico.csv
          git commit -m "Atualizar indicadores do INE e da Pordata"
          git push